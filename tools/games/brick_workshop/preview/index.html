<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弹砖工坊 · Brick Workshop</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
<header><span class="eyebrow">BRICK WORKSHOP</span><h1>弹砖工坊</h1><p>移动挡板，击碎彩砖。五座光谱工坊等你点亮。</p></header>
<section class="play" aria-label="游戏试玩">
<div class="screen"><canvas width="320" height="240" aria-label="弹砖工坊游戏画面"></canvas><p id="loading" role="status">正在加载游戏…</p></div>
<div class="keys" aria-label="三个实体按键"><button data-key="0" aria-label="A：按住向左移动，暂停后长按返回标题">A</button><button data-key="1" aria-label="B：开始、发球、减速场，长按暂停">B</button><button data-key="2" aria-label="C：按住向右移动">C</button></div>
</section>
<footer><p><strong>A / C</strong> 按住移动 · <strong>B / 空格</strong> 发球 / 减速场 · <strong>B</strong> 长按暂停<br>暂停后短按 B 继续，长按 A 返回标题。</p><button id="sound" aria-pressed="false">浏览器音效关</button><p class="note">同一套 C 玩法与绘图代码 · 浏览器试玩，非实机录像</p></footer>
</main><script type="module" src="game.js"></script>
</body></html>
