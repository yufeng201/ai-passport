<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>熔岩升梯</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">LAVA LIFT</span><h1>熔岩升梯</h1><p>岩浆追上来了。移动升梯，穿过岩壁，跳起来踩掉小怪！</p></header><section class="play" aria-label="游戏试玩"><div class="screen"><canvas width="320" height="240" aria-label="熔岩升梯画面"></canvas><p id="loading" role="status">正在加载…</p></div><div class="keys"><button data-key="0">A ← 左移</button><button data-key="1">B → 右移</button><button data-key="2">C ↑ 跳跃</button></div></section><footer><p>第三键开始 / 跳跃 / 重玩。按住第一、二键移动平台。<br>键盘 ← → 空格；三格生命，到达 1200 米出口获胜。<br>平台也必须穿过岩壁空隙；跳跃下降时踩中小怪可消灭它。</p><button id="sound" aria-pressed="false">浏览器音效关</button><p class="note">离开窗口自动暂停，第三键继续。试玩记录仅保留本次会话。</p></footer></main><script type="module" src="game.js"></script></body></html>
