<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跃影疾行 · Rooftop Runner</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">ROOFTOP RUNNER</span><h1>跃影疾行</h1><p>越过屋顶，追逐晨光。用三个按键跑出自己的路线。</p></header>
<section class="play" aria-label="游戏试玩"><div class="screen"><canvas width="320" height="240" aria-label="跃影疾行游戏画面"></canvas><p id="loading" role="status">正在加载游戏…</p></div>
<div class="keys" aria-label="三个实体按键"><button data-key="0" aria-label="A：按住向左">A</button><button data-key="1" aria-label="B：按住向右，菜单确认">B</button><button data-key="2" aria-label="C：短按跳跃，长按暂停">C</button></div></section>
<footer><p><strong>A / ←</strong> 向左 · <strong>B / →</strong> 向右 · <strong>C / ↑ / 空格</strong> 跳跃<br>松开移动键，再短按 C，沿原方向跳跃。长按 C 暂停；短按 B 继续。标题页 B / 回车开始。</p><button id="sound" aria-pressed="false">浏览器音效关</button><p class="note">同一套 C 玩法与绘图代码 · 浏览器试玩，非实机录像</p></footer></main><script type="module" src="game.js"></script></body></html>
